name: PF1 C1 Synthetic Remote-Lease Race (NO LIVE)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pf1-c1-lease-race.yml'
      - 'experiments/pf1/PF1_C1_GIT_LEASE_RACE.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ephemeral-git-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: orange
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: adrianjohnsaker-wq/Amelia-0.4
          ref: f1875b5eea5339eb1ac73e50b5df6b103d0cabe9
          path: c1-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check original source and sealed PF1 constants
        shell: bash
        working-directory: orange
        run: |
          set -euo pipefail
          test "$(git -C ../c1-source rev-parse HEAD)" = f1875b5eea5339eb1ac73e50b5df6b103d0cabe9
          echo 'ecabf3e40023faa0be0749908cfe6ffd3a8b9e42ab7c8a9a7c2ea5827ae63610  experiments/pf1/PF1_A1_R2_CONSTANTS.json' | sha256sum -c -
          echo PINNED_FIXTURE_CHECK_PASS
      - name: Two real Git processes contest one prospective local lease, six independent trials
        env:
          PF1_PINNED_C1_DIR: ${{ github.workspace }}/c1-source
          PF1_RACE_OUTPUT: ${{ github.workspace }}/orange/experiments/pf1/c1-compat-output/C1_GIT_LEASE_RACE.json
          DRIFT_C1_ENABLE_LIVE: 'false'
          PF1_NO_NETWORK: '1'
        working-directory: orange
        run: |
          set -euo pipefail
          python experiments/pf1/PF1_C1_GIT_LEASE_RACE.py
      - name: Retain failed races as evidence (do not bury scientific failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PF1-C1-EPHEMERAL-GIT-LEASE-RACE
          retention-days: 90
          if-no-files-found: warn
          path: |
            orange/experiments/pf1/PF1_C1_GIT_LEASE_RACE.py
            orange/experiments/pf1/c1-compat-output/C1_GIT_LEASE_RACE.json
      - name: Archive the tested result even if the race gate fails
        if: always()
        shell: bash
        working-directory: orange
        run: |
          set -euo pipefail
          p=experiments/pf1/c1-compat-output/C1_GIT_LEASE_RACE.json
          if [ ! -f "$p" ]; then exit 0; fi
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add "$p"
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Archive PF1 C1 pinned ephemeral Git lease race; live remains disabled'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
