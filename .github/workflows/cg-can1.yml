# CAN-1 (experiments/cybergothic/canonical_rerun/REGISTRATION.md). seal.trigger: RFC3161 over registration, canonical engine and
# analysis. run.trigger: hybrid equivalence check, then the canonical runs and REP-1's analysis. Runs only on this branch.
name: CG CAN-1
on:
  push:
    branches: [cybergothic-20261115]
    paths: ['experiments/cybergothic/canonical_rerun/seal.trigger', 'experiments/cybergothic/canonical_rerun/run.trigger']
permissions:
  contents: write
concurrency:
  group: cg-can1
  cancel-in-progress: false
jobs:
  can1:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/checkout@v4
        with: { repository: adrianjohnsaker-wq/Amelia-0.4, ref: f1875b5eea5339eb1ac73e50b5df6b103d0cabe9, path: c1-pin, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: seal (once) or run
        shell: bash
        env: { PYTHONPATH: '${{ github.workspace }}/c1-pin', PYTHONDONTWRITEBYTECODE: '1', DRIFT_C1_ENABLE_LIVE: 'false' }
        run: |
          set -euo pipefail
          D=experiments/cybergothic; P=$D/canonical_rerun; C=$D/canonical
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install -q -r c1-pin/drift1a_c1/requirements.txt
          export FILES="$P/REGISTRATION.md $D/replication1/analyse.py .github/workflows/cg-can1.yml $(ls $C/*.py | tr '\n' ' ')"
          if git diff --name-only HEAD~1 HEAD | grep -qx "$P/seal.trigger" && [ ! -e $P/seal/receipt.json ]; then
            python - <<'PY'
          import datetime, hashlib, json, os, pathlib
          from drift1a_c1.beacon import Sealer
          P = pathlib.Path('experiments/cybergothic/canonical_rerun'); sha = lambda f: hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          b = {'schema': 'CG_CAN1_V1', 'sealedAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
               'seeds': {'stop': [64001, 64300], 'birth': [65001, 65030]}, 'topology': 'canonical',
               'sourceSHA256': [{'path': f, 'sha256': sha(f)} for f in os.environ['FILES'].split()]}
          (P / 'seal').mkdir(exist_ok=True); (P / 'seal/CAN1_BUNDLE.json').write_text(json.dumps(b, sort_keys=True, indent=2) + '\n')
          imprint = sha(P / 'seal/CAN1_BUNDLE.json'); Sealer().seal(P / 'seal', imprint)
          assert Sealer().verify(P / 'seal', imprint)['status'] == 'PASS'; print('CAN1_SEALED', imprint)
          PY
            git add $P/seal; MSG='CG CAN-1 registration sealed (RFC3161)'
          elif git diff --name-only HEAD~1 HEAD | grep -qx "$P/run.trigger" && [ -e $P/seal/receipt.json ] && [ ! -e $P/result/RESULT.json ]; then
            python - <<'PY'
          import hashlib, json, pathlib
          from drift1a_c1.beacon import Sealer
          P = pathlib.Path('experiments/cybergothic/canonical_rerun'); sha = lambda f: hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          b = json.loads((P / 'seal/CAN1_BUNDLE.json').read_text())
          assert Sealer().verify(P / 'seal', sha(P / 'seal/CAN1_BUNDLE.json'))['status'] == 'PASS'
          for x in b['sourceSHA256']: assert sha(x['path']) == x['sha256'], x['path']
          print('CAN1_SEAL_AND_SOURCES_VERIFIED')
          PY
            (cd $C && CG_TOPOLOGY=hybrid python equivalence_check.py | tail -1 | grep -qx HYBRID_EQUIVALENT) && echo HYBRID_EQUIVALENT
            O=$RUNNER_TEMP/can1; mkdir -p $O
            (cd $C && CG_TOPOLOGY=canonical python stop_trial.py --start 64001 --seeds 300 --workers 4 --output $O/stop | tail -2)
            (cd $C && CG_TOPOLOGY=canonical python from_birth_study.py --start 65001 --seeds 30 --horizon 180 --workers 4 --output $O/birth | tail -2)
            mkdir -p $P/result/stop $P/result/birth; python -I $D/replication1/analyse.py $O/stop $O/birth $P/result/RESULT.json
            cp $O/stop/seed_*.json $P/result/stop/; cp $O/birth/seed_*.json $P/result/birth/
            git add $P/result; MSG='CG CAN-1 result'
          else echo 'nothing to do'; exit 0; fi
          git commit -qm "$MSG"
          for i in 1 2 3 4; do git pull -q --rebase origin cybergothic-20261115 && git push -q origin HEAD:cybergothic-20261115 && break; sleep $((2**i)); done
