# THE ANTENNA collector (amendment 1): one long job collecting every 15 minutes for up to 5h40m, then it starts its
# successor; the schedule is only a backup (GitHub fires this repository's schedules every few hours). Until 4 Nov 02:00 UTC.
name: ANTENNA collect
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: antenna-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: window
        id: w
        run: |
          if [ "$(date -u +%s)" -gt "$(date -u -d '2026-11-04T02:00:00Z' +%s)" ]; then echo go=no >> "$GITHUB_OUTPUT"; else echo go=yes >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.w.outputs.go == 'yes'
        with: { ref: f0e045f592c9369458c146bb5989dd1348572d65, path: code }
      - uses: actions/checkout@v4
        if: steps.w.outputs.go == 'yes'
        with: { ref: antenna-live, path: live }
      - uses: actions/checkout@v4
        if: steps.w.outputs.go == 'yes'
        with: { repository: adrianjohnsaker-wq/Amelia-0.4, ref: f1875b5eea5339eb1ac73e50b5df6b103d0cabe9, path: c1-pin, persist-credentials: false }
      - uses: actions/setup-python@v5
        if: steps.w.outputs.go == 'yes'
        with: { python-version: '3.12' }
      - name: collect every 15 minutes, seal each batch, commit; then hand on
        if: steps.w.outputs.go == 'yes'
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/c1-pin
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python -m pip install -q -r c1-pin/drift1a_c1/requirements.txt
          t0=$(date -u +%s); end=$(date -u -d '2026-11-04T02:00:00Z' +%s)
          cat > "$RUNNER_TEMP/cycle.sh" <<'SH'
          set -euo pipefail
          git -C live pull -q --rebase origin antenna-live
          stamp=$(python code/experiments/antenna/collect.py live | tail -1 | cut -d' ' -f1)
          test -n "$stamp"
          python - "$stamp" <<'PY' || echo "ANTENNA_BATCH_SEAL_FAILED $stamp" | tee -a live/seal_failures.txt
          import hashlib, pathlib, sys
          from drift1a_c1.beacon import Sealer
          b = pathlib.Path('live/batches') / (sys.argv[1] + '.json')
          imprint = hashlib.sha256(b.read_bytes()).hexdigest()
          Sealer().seal(pathlib.Path('live/seals') / sys.argv[1], imprint)
          print('ANTENNA_BATCH_SEALED', sys.argv[1], imprint)
          PY
          cd live && git add -A
          git -c user.name='antenna' -c user.email='antenna@users.noreply.github.com' commit -qm "THE ANTENNA batch $stamp"
          for i in 1 2 3 4; do git push -q origin HEAD:antenna-live && exit 0; sleep $((2**i)); git pull -q --rebase origin antenna-live; done; exit 1
          SH
          while :; do
            s=$(date -u +%s); [ "$s" -gt "$end" ] && break
            bash "$RUNNER_TEMP/cycle.sh" || echo "ANTENNA_CYCLE_FAILED $(date -u +%FT%TZ)"
            [ $(( $(date -u +%s) - t0 )) -gt 20400 ] && break
            w=$(( 900 - ($(date -u +%s) - s) )); [ "$w" -gt 0 ] && sleep "$w"
          done
          if [ "$(date -u +%s)" -lt "$end" ]; then gh workflow run antenna-collect.yml --ref main -R "${{ github.repository }}" && echo ANTENNA_SUCCESSOR_STARTED; fi
