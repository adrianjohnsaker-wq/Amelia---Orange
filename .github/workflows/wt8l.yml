name: WT-8L (Θ = 12 on a young state)

# experiments/live-amelia/wt8l/REGISTRATION.md. Started by committing a UTC time to experiments/live-amelia/wt8l/run.trigger.
on:
  push:
    branches: [research/live-run-history-20261109]
    paths: ['experiments/live-amelia/wt8l/run.trigger']

permissions:
  contents: read

concurrency:
  group: wt8l
  cancel-in-progress: false

jobs:
  wt8l:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Machinery checks (synthetic only)
        run: bun test --timeout 900000 experiments/live-amelia/wt8l.test.ts
      - name: Run WT-8L (determinism, 24 once-through runs, the registered analysis)
        env:
          SUPABASE_URL: https://rcgmtdponfljpribggsq.supabase.co
          AMELIA_SUPABASE_SERVICE_KEY: ${{ secrets.AMELIA_SUPABASE_SERVICE_KEY }}
        run: bun experiments/live-amelia/wt8l/run_actions.ts
