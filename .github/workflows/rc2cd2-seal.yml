# RC-2 / CD-2 (experiments/rc2/REGISTRATION.md, experiments/cd2/REGISTRATION.md).
# experiments/rc2/seal.trigger: one RFC3161 token over registrations, code and calibrations (fixes the CD-2 data start
# and opens the live study). experiments/cd2/run.trigger: the CD-2 world run. experiments/rc2/analyse.trigger: the
# RC-2 final analysis after the stop time. Runs only on this branch; writes only experiments/rc2 and experiments/cd2.
name: RC-2 CD-2 seal and analyses
on:
  push:
    branches: [rc2cd2-20261106]
    paths: ['experiments/rc2/seal.trigger', 'experiments/cd2/run.trigger', 'experiments/rc2/analyse.trigger']
permissions:
  contents: write
concurrency:
  group: rc2cd2-seal
  cancel-in-progress: false
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/checkout@v4
        with: { repository: adrianjohnsaker-wq/Amelia-0.4, ref: f1875b5eea5339eb1ac73e50b5df6b103d0cabe9, path: c1-pin, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: seal, CD-1 world run, or AG-1/RC-1 analysis
        shell: bash
        env: { PYTHONPATH: '${{ github.workspace }}/c1-pin', PYTHONDONTWRITEBYTECODE: '1', DRIFT_C1_ENABLE_LIVE: 'false' }
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install -q -r c1-pin/drift1a_c1/requirements.txt
          mkdir -p /tmp/tsx && (cd /tmp/tsx && npm init -y >/dev/null && npm i -s tsx@4.23.15) && ln -s /tmp/tsx/node_modules node_modules
          changed=$(git diff --name-only HEAD~1 HEAD)
          if echo "$changed" | grep -qx 'experiments/rc2/seal.trigger' && [ ! -e experiments/rc2/seal/receipt.json ]; then
            python - <<'PY'
          import datetime,hashlib,json,pathlib,subprocess
          from drift1a_c1.beacon import Sealer
          S=pathlib.Path('experiments/rc2/seal'); sha=lambda f:hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          files=sorted(subprocess.run(['git','ls-files','experiments/rc2','experiments/cd2','experiments/agentic','experiments/cd1','experiments/synthetic-pointer/nr1','experiments/synthetic-pointer/nr2',
            'experiments/synthetic-pointer/sxi1r','experiments/synthetic-pointer/sxi0c/repaired.ts','experiments/synthetic-pointer/observer.ts',
            'experiments/synthetic-pointer/pointer.ts','.github/workflows/rc2cd2-seal.yml'],capture_output=True,text=True,check=True).stdout.split())
          files=[f for f in files if '/result' not in f and '/seal/' not in f and not f.endswith('.trigger')]
          t=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          b={'schema':'RC2_CD2_REGISTRATION_V1','sealedAt':t,'cd2WorldDataFirstSeenAtOrAfter':t,'cd2N':12000,'rc2':{'studyStartsAfter':t,'stop':'2026-11-21T00:00:00Z','ledgerBranch':'rc2-live-ledger'},
             'sourceSHA256':[{'path':f,'sha256':sha(f)} for f in files]}
          S.mkdir(exist_ok=True); (S/'BUNDLE.json').write_text(json.dumps(b,sort_keys=True,indent=2)+'\n')
          imprint=sha(S/'BUNDLE.json'); Sealer().seal(S,imprint); assert Sealer().verify(S,imprint)['status']=='PASS'; print('RC2_CD2_SEALED',t,imprint)
          PY
            git add experiments/rc2/seal; MSG='RC-2/CD-2 registration sealed (RFC3161)'
          else
            python - <<'PY'
          import hashlib,json,pathlib
          from drift1a_c1.beacon import Sealer
          S=pathlib.Path('experiments/rc2/seal'); sha=lambda f:hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          b=json.loads((S/'BUNDLE.json').read_text()); assert Sealer().verify(S,sha(S/'BUNDLE.json'))['status']=='PASS'
          for x in b['sourceSHA256']: assert sha(x['path'])==x['sha256'],x['path']
          pathlib.Path('/tmp/since').write_text(b['cd2WorldDataFirstSeenAtOrAfter']); print('RC2_CD2_SEAL_AND_SOURCES_VERIFIED')
          PY
            git fetch -q --depth 1 origin world-live && git worktree add -q /tmp/live FETCH_HEAD
            if echo "$changed" | grep -qx 'experiments/cd2/run.trigger'; then
              if ! python3 experiments/cd2/prepare_world.py /tmp/live "$(cat /tmp/since)" 12000 /tmp/world.json; then echo 'CD2_WORLD_DATA_NOT_READY'; exit 0; fi
              sh experiments/cd2/run_world.sh /tmp/world.json experiments/cd2/result; cp /tmp/world.json experiments/cd2/result/world.json
              git add experiments/cd2/result; MSG='CD-2 world result'
            else
              git fetch -q origin rc2-live-ledger && git worktree add -q /tmp/ledger FETCH_HEAD
              python3 -I experiments/rc2/analyse2.py /tmp/live /tmp/ledger 2026-11-21T00:00:00Z /tmp/agres
              mkdir -p experiments/rc2/result && cp /tmp/agres/RESULT.json /tmp/agres/log.json experiments/rc2/result/
              git add experiments/rc2/result; MSG='RC-2 final analysis'
            fi
          fi
          rm -f node_modules; git commit -qm "$MSG"
          for i in 1 2 3 4; do git pull -q --rebase origin rc2cd2-20261106 && git push -q origin HEAD:rc2cd2-20261106 && break; sleep $((2**i)); done
