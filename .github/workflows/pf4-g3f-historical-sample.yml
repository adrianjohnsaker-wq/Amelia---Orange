name: PF4 G3f — 10 historical 14-day Quicknet worlds sampled BLS feasibility
on:
  push:
    branches:
      - design/pf4-inscription-precommit-20261024
    paths:
      - experiments/pf4/PF4_G3F_HISTORICAL_QUICKNET_SAMPLE.py
      - .github/workflows/pf4-g3f-historical-sample.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: adrianjohnsaker-wq/Amelia-0.4
          ref: f1875b5eea5339eb1ac73e50b5df6b103d0cabe9
          path: c1-pin
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned Quicknet BLS dependency, not live state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C c1-pin rev-parse HEAD)" = f1875b5eea5339eb1ac73e50b5df6b103d0cabe9
          python3 -m pip install -r c1-pin/drift1a_c1/requirements.txt
      - name: Verify ten world starts, alignment and all historical time bounds offline
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/c1-pin
          DRIFT_C1_ENABLE_LIVE: 'false'
        run: |
          set -euo pipefail
          python3 experiments/pf4/PF4_G3F_HISTORICAL_QUICKNET_SAMPLE.py --self-test
      - name: Fetch and authenticate only 30 ALREADY-PUBLISHED historical round samples
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/c1-pin
          DRIFT_C1_ENABLE_LIVE: 'false'
        run: |
          set -euo pipefail
          python3 experiments/pf4/PF4_G3F_HISTORICAL_QUICKNET_SAMPLE.py --fetch-sample
      - name: Assert sample is not full-window calibration or future-source test
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/pf4-historical-g3f/PF4_G3F_SAMPLE_HISTORY.json'))
          assert x['sampleVerified']==30 and x['totalHistoricalTicksRequired']==201600
          assert x['readOnly'] and not x['observedFutureRounds']
          assert not x['allPhysicalHistoricalWindowsFullyBLSVerified']
          assert not x['allPhysicalHistoricalWindowsRmeanComputed']
          print('PF4_G3F_HISTORICAL_SAMPLE_ONLY_NEVER_SEAL')
          PY
      - name: Publish derived historical authenticated sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf4-g3f-30-published-rounds-authenticated
          path: /tmp/pf4-historical-g3f/
          retention-days: 30
          if-no-files-found: warn
