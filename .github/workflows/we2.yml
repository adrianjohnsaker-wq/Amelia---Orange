# WE-2 (experiments/synthetic-pointer/we2/REGISTRATION.md). seal.trigger: RFC3161 over registration, code and calibration.
# run.trigger: the registered run on WE-1's data window. Runs only on this branch; writes only experiments/synthetic-pointer/we2/.
name: WE-2
on:
  push:
    branches: [nr3-field-ingress-20261109]
    paths: ['experiments/synthetic-pointer/we2/seal.trigger', 'experiments/synthetic-pointer/we2/run.trigger']
permissions:
  contents: write
concurrency:
  group: we2
  cancel-in-progress: false
jobs:
  we2:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/checkout@v4
        with: { repository: adrianjohnsaker-wq/Amelia-0.4, ref: f1875b5eea5339eb1ac73e50b5df6b103d0cabe9, path: c1-pin, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: seal (once) or run
        shell: bash
        env: { PYTHONPATH: '${{ github.workspace }}/c1-pin', PYTHONDONTWRITEBYTECODE: '1', DRIFT_C1_ENABLE_LIVE: 'false', TMPDIR: '${{ runner.temp }}' }
        run: |
          set -euo pipefail
          P=experiments/synthetic-pointer/we2; S=experiments/synthetic-pointer; SINCE=2026-11-13T17:56:41Z
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install -q -r c1-pin/drift1a_c1/requirements.txt
          export FILES="$P/REGISTRATION.md $P/prepare.py $P/surrogates.py $P/run.ts $P/analysis.py $P/pipeline.sh $P/equivalence.ts $P/calibration/CALIBRATION.jsonl $S/we1/encode.py $S/we1/calibration/EDGES.json $S/wt4/wt4Runtime.ts $S/wt4/run.ts $S/nr1/graphs.ts $S/nr1/nrRuntime.ts $S/sxi1r/analysis.py src/core/fullNumogram.ts .github/workflows/we2.yml"
          if git diff --name-only HEAD~1 HEAD | grep -qx "$P/seal.trigger" && [ ! -e $P/seal/receipt.json ]; then
            python - <<'PY'
          import datetime, hashlib, json, os, pathlib
          from drift1a_c1.beacon import Sealer
          P = pathlib.Path('experiments/synthetic-pointer/we2'); sha = lambda f: hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          b = {'schema': 'WE2_REGISTRATION_V1', 'worldDataFirstSeenAtOrAfter': '2026-11-13T17:56:41Z', 'N': 12000,
               'sealedAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
               'sourceSHA256': [{'path': f, 'sha256': sha(f)} for f in os.environ['FILES'].split()]}
          (P / 'seal').mkdir(exist_ok=True); (P / 'seal/WE2_BUNDLE.json').write_text(json.dumps(b, sort_keys=True, indent=2) + '\n')
          imprint = sha(P / 'seal/WE2_BUNDLE.json'); Sealer().seal(P / 'seal', imprint)
          assert Sealer().verify(P / 'seal', imprint)['status'] == 'PASS'; print('WE2_SEALED', imprint)
          PY
            git add $P/seal; MSG='WE-2 registration sealed (RFC3161)'
          elif git diff --name-only HEAD~1 HEAD | grep -qx "$P/run.trigger" && [ -e $P/seal/receipt.json ] && [ ! -e $P/result/WE2_RESULT.json ]; then
            python - <<'PY'
          import hashlib, json, pathlib
          from drift1a_c1.beacon import Sealer
          P = pathlib.Path('experiments/synthetic-pointer/we2'); sha = lambda f: hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          b = json.loads((P / 'seal/WE2_BUNDLE.json').read_text())
          assert Sealer().verify(P / 'seal', sha(P / 'seal/WE2_BUNDLE.json'))['status'] == 'PASS'
          for x in b['sourceSHA256']: assert sha(x['path']) == x['sha256'], x['path']
          print('WE2_SEAL_AND_SOURCES_VERIFIED')
          PY
            git fetch -q --depth 1 origin world-live && git worktree add -q /tmp/live FETCH_HEAD
            if ! python3 -I $P/prepare.py /tmp/live $SINCE 12000 $S/we1/calibration/EDGES.json /tmp/we2in.json; then echo 'WE2_WORLD_DATA_NOT_READY'; exit 0; fi
            mkdir -p /tmp/tsx && (cd /tmp/tsx && npm init -y >/dev/null && npm i -s tsx@4.23.15) && ln -s /tmp/tsx/node_modules node_modules
            node --import tsx $P/equivalence.ts
            sh $P/pipeline.sh /tmp/we2in.json /tmp/we2
            mkdir -p $P/result; cp /tmp/we2/WE2_RESULT.json /tmp/we2in.json $P/result/
            rm -f node_modules; git add $P/result; MSG='WE-2 world result'
          else echo 'nothing to do'; exit 0; fi
          git commit -qm "$MSG"
          for i in 1 2 3 4; do git pull -q --rebase origin nr3-field-ingress-20261109 && git push -q origin HEAD:nr3-field-ingress-20261109 && break; sleep $((2**i)); done
