name: Language model as Amelia's Outside (32 lineages, double-video and Quatermass descriptives)
on:
  push:
    branches: [llm-outside-20261026]
    paths: ['.github/workflows/llm-outside.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        world: [S05W1, S05W2, S05W3, S05W4, S05W5, S05W6, S05W7, S05W8]
        pair: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run one lineage with the model as Outside
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::Repository secret ANTHROPIC_API_KEY is empty or named differently"; exit 1; }
          mkdir -p out
          node --max-old-space-size=3000 --experimental-strip-types --no-warnings experiments/llm_outside/llm_outside.mjs \
            "$PWD/experiments/studio/runtime_mirror" "$PWD/experiments/double_video/start_states.json" \
            ${{ matrix.world }} ${{ matrix.pair }} out/${{ matrix.world }}_${{ matrix.pair }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: llm-outside-${{ matrix.world }}-${{ matrix.pair }}
          path: out/
          retention-days: 90
  score:
    needs: lineage
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: llm-outside-*
          path: runs
          merge-multiple: true
      - name: Score against the registered rule and commit the results
        run: |
          set -euo pipefail
          mkdir -p experiments/llm_outside/results
          python3 experiments/llm_outside/score.py runs experiments/llm_outside/results | tee experiments/llm_outside/results/RESULT.txt
          git config user.name "llm-outside scorer"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/llm_outside/results
          git commit -m "Language model as Amelia's Outside: results scored against the registered rule"
          git push origin HEAD:${{ github.ref_name }}
