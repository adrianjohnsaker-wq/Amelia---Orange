name: Amelia Outside continuous ingress
on:
  push:
    branches: [main]
    paths: ['.github/workflows/outside-continuous-ingress.yml', 'experiments/outside/continuous-runner.ts']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amelia-outside-continuous-ingress
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: outside-live-ledger
          path: live
      - uses: actions/checkout@v4
        with:
          ref: enochian-watchtower-antenna-20261101
          path: watchtower-code
      - uses: actions/checkout@v4
        with:
          ref: watchtower-live-ledger
          path: watchtower-live
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run one Subdecadence and live ingress cycle through Amelia
        working-directory: code
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npx --yes tsx@4.23.15 experiments/outside/continuous-runner.ts "${{ github.workspace }}/live"
      - name: Append the verified ledger and Amelia state
        working-directory: live
        run: |
          git config user.name "amelia-outside-collector"
          git config user.email "amelia-outside-collector@users.noreply.github.com"
          git add state.json ledger.json LATEST.md
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
            exit 0
          fi
          git commit -m "Outside ingress cycle ${{ github.run_id }}-${{ github.run_attempt }}"
          git push origin HEAD:outside-live-ledger
      - name: Record Watchtower aperture and encounter atlas
        working-directory: watchtower-code
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npx --yes tsx@4.23.15 experiments/watchtower/continuous-runner.ts "${{ github.workspace }}/live/ledger.json" "${{ github.workspace }}/watchtower-live"
      - name: Append the Watchtower ledger and atlas
        working-directory: watchtower-live
        run: |
          git config user.name "amelia-watchtower-collector"
          git config user.email "amelia-watchtower-collector@users.noreply.github.com"
          git add state.json ledger.json atlas.json LATEST.md
          if git diff --cached --quiet; then
            echo "No Watchtower changes to commit."
            exit 0
          fi
          git commit -m "Enochian Watchtower cycle ${{ github.run_id }}-${{ github.run_attempt }}"
          git push origin HEAD:watchtower-live-ledger
