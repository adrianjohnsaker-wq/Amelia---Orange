name: Amelia Outside continuous ingress
on:
  push:
    branches: [main]
    paths: ['.github/workflows/outside-continuous-ingress.yml', 'experiments/outside/continuous-runner.ts']
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: amelia-outside-continuous-ingress
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: outside-live-ledger
          path: live
      - uses: actions/checkout@v4
        with:
          ref: enochian-watchtower-antenna-20261101
          path: watchtower-code
      - uses: actions/checkout@v4
        with:
          ref: watchtower-live-ledger
          path: watchtower-live
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Poll continuously, persist each cycle, and hand off
        working-directory: code
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          cycle_started_at=$(date -u +%s)
          handoff_at=$((cycle_started_at + 20400))
          cycle_index=0

          commit_and_push() {
            local repo_dir="$1"
            local branch_name="$2"
            local commit_message="$3"
            git -C "$repo_dir" add state.json ledger.json LATEST.md
            if [ "$repo_dir" = "${{ github.workspace }}/watchtower-live" ]; then
              git -C "$repo_dir" add atlas.json
            fi
            if git -C "$repo_dir" diff --cached --quiet; then
              echo "No changes for $branch_name."
              return 0
            fi
            git -C "$repo_dir" -c user.name='amelia-outside-collector' -c user.email='amelia-outside-collector@users.noreply.github.com' commit -qm "$commit_message"
            for attempt in 1 2 3 4; do
              if git -C "$repo_dir" push -q origin "HEAD:$branch_name"; then return 0; fi
              sleep $((2 ** attempt))
              git -C "$repo_dir" pull -q --rebase origin "$branch_name" || return 1
            done
            return 1
          }

          reset_data_checkout() {
            local repo_dir="$1"
            local branch_name="$2"
            git -C "$repo_dir" fetch -q origin "$branch_name"
            git -C "$repo_dir" reset --hard FETCH_HEAD
            git -C "$repo_dir" clean -fd
          }

          run_cycle() {
            cycle_index=$((cycle_index + 1))
            cycle_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${cycle_index}"
            echo "OUTSIDE_CYCLE_START $cycle_id $(date -u +%FT%TZ)"
            git -C "${{ github.workspace }}/live" pull -q --rebase origin outside-live-ledger
            git -C "${{ github.workspace }}/watchtower-live" pull -q --rebase origin watchtower-live-ledger

            (cd "${{ github.workspace }}/code" && RUN_ID="$cycle_id" npx --yes tsx@4.23.15 experiments/outside/continuous-runner.ts "${{ github.workspace }}/live")
            commit_and_push "${{ github.workspace }}/live" outside-live-ledger "Outside ingress cycle $cycle_id"

            (cd "${{ github.workspace }}/watchtower-code" && RUN_ID="$cycle_id" npx --yes tsx@4.23.15 experiments/watchtower/continuous-runner.ts "${{ github.workspace }}/live/ledger.json" "${{ github.workspace }}/watchtower-live")
            commit_and_push "${{ github.workspace }}/watchtower-live" watchtower-live-ledger "Enochian Watchtower cycle $cycle_id"
            echo "OUTSIDE_CYCLE_COMPLETE $cycle_id $(date -u +%FT%TZ)"
          }

          while [ "$(date -u +%s)" -lt "$handoff_at" ]; do
            cycle_started_at=$(date -u +%s)
            if ! run_cycle; then
              echo "OUTSIDE_CYCLE_FAILED $(date -u +%FT%TZ); resetting data checkouts before retry."
              reset_data_checkout "${{ github.workspace }}/live" outside-live-ledger || exit 1
              reset_data_checkout "${{ github.workspace }}/watchtower-live" watchtower-live-ledger || exit 1
            fi
            now=$(date -u +%s)
            remaining=$((handoff_at - now))
            [ "$remaining" -le 0 ] && break
            elapsed=$((now - cycle_started_at))
            wait_seconds=$((900 - elapsed))
            [ "$wait_seconds" -le 0 ] && continue
            [ "$wait_seconds" -gt "$remaining" ] && wait_seconds="$remaining"
            echo "OUTSIDE_NEXT_SCAN_IN $wait_seconds seconds"
            sleep "$wait_seconds"
          done

          echo "OUTSIDE_HANDOFF $(date -u +%FT%TZ)"
          gh workflow run outside-continuous-ingress.yml --ref main -R "$REPOSITORY" || {
            echo "OUTSIDE_SUCCESSOR_DISPATCH_FAILED; hourly schedule is the recovery trigger."
            exit 1
          }
          echo "OUTSIDE_SUCCESSOR_STARTED"
