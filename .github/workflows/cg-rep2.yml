# REP-1 (experiments/cybergothic/rep2/REGISTRATION.md). seal.trigger: RFC3161 over the registration, the analysis and
# the shipped engine sources. run.trigger: the registered runs and analysis. Runs only on this branch.
name: CG REP-2
on:
  push:
    branches: [cybergothic-20261115]
    paths: ['experiments/cybergothic/rep2/seal.trigger', 'experiments/cybergothic/rep2/run.trigger']
permissions:
  contents: write
concurrency:
  group: cg-rep2
  cancel-in-progress: false
jobs:
  rep2:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/checkout@v4
        with: { repository: adrianjohnsaker-wq/Amelia-0.4, ref: f1875b5eea5339eb1ac73e50b5df6b103d0cabe9, path: c1-pin, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: seal (once) or run
        shell: bash
        env: { PYTHONPATH: '${{ github.workspace }}/c1-pin', PYTHONDONTWRITEBYTECODE: '1', DRIFT_C1_ENABLE_LIVE: 'false' }
        run: |
          set -euo pipefail
          D=experiments/cybergothic; P=$D/rep2; C=$D/canonical_r4
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install -q -r c1-pin/drift1a_c1/requirements.txt
          export FILES="$P/REGISTRATION.md $P/analyse.py .github/workflows/cg-rep2.yml $(ls $C/*.py | tr '\n' ' ')"
          if git diff --name-only HEAD~1 HEAD | grep -qx "$P/seal.trigger" && [ ! -e $P/seal/receipt.json ]; then
            python - <<'PY'
          import datetime, hashlib, json, os, pathlib
          from drift1a_c1.beacon import Sealer
          P = pathlib.Path('experiments/cybergothic/rep2'); sha = lambda f: hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          b = {'schema': 'CG_REP2_V1', 'sealedAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
               'seeds': {'hybrid': [66001, 66060], 'canonical': [67001, 67060]}, 'sourceSHA256': [{'path': f, 'sha256': sha(f)} for f in os.environ['FILES'].split()]}
          (P / 'seal').mkdir(exist_ok=True); (P / 'seal/REP2_BUNDLE.json').write_text(json.dumps(b, sort_keys=True, indent=2) + '\n')
          imprint = sha(P / 'seal/REP2_BUNDLE.json'); Sealer().seal(P / 'seal', imprint)
          assert Sealer().verify(P / 'seal', imprint)['status'] == 'PASS'; print('REP2_SEALED', imprint)
          PY
            git add $P/seal; MSG='CG REP-2 registration sealed (RFC3161)'
          elif git diff --name-only HEAD~1 HEAD | grep -qx "$P/run.trigger" && [ -e $P/seal/receipt.json ] && [ ! -e $P/result/RESULT.json ]; then
            python - <<'PY'
          import hashlib, json, pathlib
          from drift1a_c1.beacon import Sealer
          P = pathlib.Path('experiments/cybergothic/rep2'); sha = lambda f: hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          b = json.loads((P / 'seal/REP2_BUNDLE.json').read_text())
          assert Sealer().verify(P / 'seal', sha(P / 'seal/REP2_BUNDLE.json'))['status'] == 'PASS'
          for x in b['sourceSHA256']: assert sha(x['path']) == x['sha256'], x['path']
          print('REP2_SEAL_AND_SOURCES_VERIFIED')
          PY
            (cd $C && CG_TOPOLOGY=hybrid python equivalence_check.py | tail -1 | grep -qx HYBRID_EQUIVALENT) && echo HYBRID_EQUIVALENT
            O=$RUNNER_TEMP/rep2; mkdir -p $O
            (cd $C && CG_TOPOLOGY=hybrid python donor_context_study.py --start 66001 --seeds 60 --per-phase 2 --workers 4 --output $O/hybrid | tail -1)
            (cd $C && CG_TOPOLOGY=canonical python donor_context_study.py --start 67001 --seeds 60 --per-phase 2 --workers 4 --output $O/canonical | tail -1)
            mkdir -p $P/result; python -I $P/analyse.py $O/hybrid $O/canonical $P/result/RESULT.json
            for part in hybrid canonical; do mkdir -p $P/result/$part; python -I - $O/$part $P/result/$part <<'PY2'
          import glob, json, sys, pathlib
          src, dst = sys.argv[1], pathlib.Path(sys.argv[2])
          for f in glob.glob(f'{src}/seed_*.json'):
              r = json.load(open(f))
              for t in r['trials']:
                  for o in t['outcomes'].values(): o.pop('actions', None)
              (dst / pathlib.Path(f).name).write_text(json.dumps(r, sort_keys=True))
          PY2
            done
            git add $P/result; MSG='CG REP-2 result'
          else echo 'nothing to do'; exit 0; fi
          git commit -qm "$MSG"
          for i in 1 2 3 4; do git pull -q --rebase origin cybergothic-20261115 && git push -q origin HEAD:cybergothic-20261115 && break; sleep $((2**i)); done
