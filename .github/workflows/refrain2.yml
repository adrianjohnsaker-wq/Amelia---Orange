# REFRAIN-2 (experiments/fep-inversion/refrain2/REGISTRATION.md). seal.trigger: RFC3161 over registration, mirror, harness and analysis.
# run.trigger: verify seal and sources, mirror equivalence, then 180 runs and the analysis. Runs only on this branch.
name: REFRAIN-2
on:
  push:
    branches: [fep-inversion-20261116]
    paths: ['experiments/fep-inversion/refrain2/seal.trigger', 'experiments/fep-inversion/refrain2/run.trigger']
permissions:
  contents: write
concurrency:
  group: refrain2
  cancel-in-progress: false
jobs:
  fep:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/checkout@v4
        with: { repository: adrianjohnsaker-wq/Amelia-0.4, ref: f1875b5eea5339eb1ac73e50b5df6b103d0cabe9, path: c1-pin, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: seal (once) or run
        shell: bash
        env: { PYTHONPATH: '${{ github.workspace }}/c1-pin', PYTHONDONTWRITEBYTECODE: '1', DRIFT_C1_ENABLE_LIVE: 'false' }
        run: |
          set -euo pipefail
          E=experiments/fep-inversion; P=$E/refrain2
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install -q -r c1-pin/drift1a_c1/requirements.txt
          export FILES="$P/REGISTRATION.md $E/refrain2.mjs $E/fep.mjs $E/analyse_refrain2.mjs $E/run_refrain2.sh $E/eqcheck.mjs .github/workflows/refrain2.yml $(find $E/nd $E/nd0 -name '*.ts' | sort | tr '\n' ' ')"
          if git diff --name-only HEAD~1 HEAD | grep -qx "$P/seal.trigger" && [ ! -e $P/seal/receipt.json ]; then
            python - <<'PY'
          import datetime, hashlib, json, os, pathlib
          from drift1a_c1.beacon import Sealer
          P = pathlib.Path('experiments/fep-inversion/refrain2'); sha = lambda f: hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          b = {'schema': 'REFRAIN2_V1', 'sealedAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
               'seeds': [20001, 20030], 'regimes': ['B', 'DT', 'DTR', 'DTR2', 'DTR2V', 'DTN'], 'steps': 6000,
               'sourceSHA256': [{'path': f, 'sha256': sha(f)} for f in os.environ['FILES'].split()]}
          (P / 'seal').mkdir(exist_ok=True); (P / 'seal/REFRAIN2_BUNDLE.json').write_text(json.dumps(b, sort_keys=True, indent=2) + '\n')
          imprint = sha(P / 'seal/REFRAIN2_BUNDLE.json'); Sealer().seal(P / 'seal', imprint)
          assert Sealer().verify(P / 'seal', imprint)['status'] == 'PASS'; print('REFRAIN2_SEALED', imprint)
          PY
            git add $P/seal; MSG='REFRAIN-2 registration sealed (RFC3161)'
          elif git diff --name-only HEAD~1 HEAD | grep -qx "$P/run.trigger" && [ -e $P/seal/receipt.json ] && [ ! -e $P/result/RESULT.json ]; then
            python - <<'PY'
          import hashlib, json, pathlib
          from drift1a_c1.beacon import Sealer
          P = pathlib.Path('experiments/fep-inversion/refrain2'); sha = lambda f: hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          b = json.loads((P / 'seal/REFRAIN2_BUNDLE.json').read_text())
          assert Sealer().verify(P / 'seal', sha(P / 'seal/REFRAIN2_BUNDLE.json'))['status'] == 'PASS'
          for x in b['sourceSHA256']: assert sha(x['path']) == x['sha256'], x['path']
          print('REFRAIN2_SEAL_AND_SOURCES_VERIFIED')
          PY
            mkdir -p $P/result
            (cd $E && node --experimental-strip-types --no-warnings eqcheck.mjs 3000 | tee refrain2/result/EQUIVALENCE.txt | tail -1 | grep -qx MIRROR_EQUIVALENT) && echo MIRROR_EQUIVALENT
            $E/run_refrain2.sh $P/result/runs 20001 20030 4
            (cd $E && node --experimental-strip-types --no-warnings analyse_refrain2.mjs refrain2/result/runs refrain2/result/RESULT.json | tee refrain2/result/RESULT.txt)
            git add $P/result; MSG='REFRAIN-2 result'
          else echo 'nothing to do'; exit 0; fi
          git commit -qm "$MSG"
          for i in 1 2 3 4; do git pull -q --rebase origin fep-inversion-20261116 && git push -q origin HEAD:fep-inversion-20261116 && break; sleep $((2**i)); done
