# THE ANTENNA: one RFC3161 token over the registration, code and workflows, before the window opens (28 Oct 2026 00:00 UTC).
name: ANTENNA seal (one-shot, before the window)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/antenna-seal.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: antenna-live
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { path: main }
      - uses: actions/checkout@v4
        with: { ref: a321e0f00f94098bb82275f170b108174bede804, path: code }
      - uses: actions/checkout@v4
        with: { repository: adrianjohnsaker-wq/Amelia-0.4, ref: f1875b5eea5339eb1ac73e50b5df6b103d0cabe9, path: c1-pin, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: seal before the window, create antenna-live
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/c1-pin
        run: |
          set -euo pipefail
          if git -C main ls-remote --exit-code --heads origin antenna-live >/dev/null; then echo 'ANTENNA_ALREADY_SEALED'; exit 0; fi
          python -m pip install -q -r c1-pin/drift1a_c1/requirements.txt
          mkdir -p live/seal
          python - <<'PY'
          import hashlib, json, pathlib, datetime
          from drift1a_c1.beacon import Sealer
          sha = lambda p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          files = ['code/experiments/antenna/' + f for f in ('REGISTRATION.md', 'collect.py', 'prepare.py', 'antenna.mjs', 'analysis.py', 'scan.mjs', 'start_states.json', 'entity_names.json')]
          files += ['main/.github/workflows/antenna-' + f + '.yml' for f in ('seal', 'collect', 'run')]
          bundle = {'schema': 'ANTENNA_SEAL_V1', 'codeCommit': 'a321e0f00f94098bb82275f170b108174bede804',
                    'windowStartUTC': '2026-10-28T00:00:00Z', 'windowEndUTC': '2026-11-04T00:00:00Z',
                    'beaconFromUTC': '2026-11-04T03:00:00Z', 'k': 12,
                    'sourceSHA256': [{'path': f.split('/', 1)[1], 'sha256': sha(f)} for f in files]}
          p = pathlib.Path('live/seal'); (p / 'ANTENNA_SEAL_BUNDLE.json').write_text(json.dumps(bundle, sort_keys=True, indent=2) + '\n')
          imprint = sha(p / 'ANTENNA_SEAL_BUNDLE.json')
          before = datetime.datetime(2026, 10, 28, tzinfo=datetime.timezone.utc).timestamp()
          Sealer().seal(p / 'token', imprint, before)
          assert Sealer().verify(p / 'token', imprint, before)['status'] == 'PASS'
          print('ANTENNA_SEALED_BEFORE_WINDOW', imprint)
          PY
          cd live && git init -q -b antenna-live && git add -A
          git -c user.name='antenna' -c user.email='antenna@users.noreply.github.com' commit -qm 'THE ANTENNA: seal before the window'
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q origin antenna-live
