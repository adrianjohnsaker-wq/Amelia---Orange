name: GATE-2L (the Outside's own lane)

# experiments/live-amelia/gate2l/REGISTRATION.md. Started by committing a UTC time to experiments/live-amelia/gate2l/run.trigger.
on:
  push:
    branches: [research/live-run-history-20261109]
    paths: ['experiments/live-amelia/gate2l/run.trigger']

permissions:
  contents: read

concurrency:
  group: gate2l
  cancel-in-progress: false

jobs:
  gate2l:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Machinery checks (synthetic only)
        run: bun test --timeout 900000 experiments/live-amelia/gate2l.test.ts
      - name: Run GATE-2L (determinism, runs, registered analysis)
        env:
          SUPABASE_URL: https://rcgmtdponfljpribggsq.supabase.co
          AMELIA_SUPABASE_SERVICE_KEY: ${{ secrets.AMELIA_SUPABASE_SERVICE_KEY }}
        run: bun experiments/live-amelia/gate2l/run_actions.ts
