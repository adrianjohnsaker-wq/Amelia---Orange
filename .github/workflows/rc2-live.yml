# RC-2 live Amelia launcher (code, registration and seal: branch rc2cd2-20261106, experiments/rc2/).
# Hourly: one epoch (experiments/rc2/epoch2.py), appended to branch rc2-live-ledger. Inert until the seal exists;
# stops at 2026-11-21T00:00Z. Touches nothing on main and is outside every PF concurrency group.
name: RC-2 live epoch
on:
  schedule:
    - cron: '22 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rc2-live
  cancel-in-progress: false
jobs:
  epoch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: rc2cd2-20261106, path: code }
      - uses: actions/checkout@v4
        with: { ref: rc2-live-ledger, path: ledger }
      - uses: actions/checkout@v4
        with: { ref: world-live, path: live }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: one epoch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e code/experiments/rc2/seal/receipt.json ]; then echo 'not sealed yet'; exit 0; fi
          if [ "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \> "2026-11-21T00:00:00Z" ]; then echo 'study ended'; exit 0; fi
          python3 - <<'PY'
          import hashlib,json,pathlib
          b=json.loads(pathlib.Path('code/experiments/rc2/seal/BUNDLE.json').read_text())
          for x in b['sourceSHA256']:
              if x['path'].startswith('experiments/rc2') or x['path'].startswith('experiments/agentic') or x['path'].startswith('experiments/synthetic-pointer'):
                  assert hashlib.sha256(pathlib.Path('code',x['path']).read_bytes()).hexdigest()==x['sha256'],x['path']
          print('sources match the seal')
          PY
          mkdir -p /tmp/tsx && (cd /tmp/tsx && npm init -y >/dev/null && npm i -s tsx@4.23.15) && ln -s /tmp/tsx/node_modules code/node_modules
          (cd code && PYTHONDONTWRITEBYTECODE=1 python3 -I experiments/rc2/epoch2.py ../live ../ledger)
          cd ledger && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -qm "RC-2 live epoch $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          for i in 1 2 3 4; do git push -q origin HEAD:rc2-live-ledger && break; sleep $((2**i)); done
