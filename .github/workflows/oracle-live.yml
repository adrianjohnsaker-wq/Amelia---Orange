# THE ORACLE v2 (exploratory, open-ended): every 30 minutes, the world stream (THE ANTENNA's to 4 Nov, then THE WORLD STREAM),
# in order of arrival, casts through the Numogram, I Ching and Tarot as Amelia asks; transcript and map to branch oracle-live.
# One long job hands on to its successor; the schedule is a backup. To stop: disable this workflow in the Actions tab.
name: ORACLE live
on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: oracle-live
  cancel-in-progress: false
jobs:
  listen:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: window
        id: w
        run: |
          echo go=yes >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.w.outputs.go == 'yes'
        with: { ref: 6a8becd4ae9a2e3ad84ed32b878b4868405bb6f1, path: code }
      - uses: actions/checkout@v4
        if: steps.w.outputs.go == 'yes'
        with: { ref: antenna-live, path: antenna }
      - uses: actions/setup-python@v5
        if: steps.w.outputs.go == 'yes'
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        if: steps.w.outputs.go == 'yes'
        with: { node-version: '22' }
      - name: listen every 30 minutes, then hand on
        if: steps.w.outputs.go == 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          npx --yes tsx@4.23.15 --version
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REMOTE" oracle-live >/dev/null; then git clone -q --depth 1 -b oracle-live "$REMOTE" live
          else mkdir live && git -C live init -q -b oracle-live && git -C live remote add origin "$REMOTE"; fi
          t0=$(date -u +%s); end=$(date -u -d '2100-01-01T00:00:00Z' +%s)
          if git ls-remote --exit-code --heads "$REMOTE" world-live >/dev/null; then git clone -q --depth 1 -b world-live "$REMOTE" world; fi
          cat > "$RUNNER_TEMP/cycle.sh" <<'SH'
          set -euo pipefail
          git -C antenna pull -q origin antenna-live
          if [ -d world ]; then git -C world pull -q origin world-live; elif git ls-remote --exit-code --heads "$(git -C live remote get-url origin)" world-live >/dev/null 2>&1; then git clone -q --depth 1 -b world-live "$(git -C live remote get-url origin)" world; fi
          git -C live pull -q --rebase origin oracle-live 2>/dev/null || true
          python3 code/experiments/oracle/stream.py "$RUNNER_TEMP/stream.json" antenna world
          npx --yes tsx@4.23.15 code/experiments/oracle/oracle.mjs "$PWD/code/experiments/studio/runtime_mirror" code/experiments/pointer4/fresh_start_states.json "$RUNNER_TEMP/stream.json" live/state.json live/transcript.jsonl
          python3 -I code/experiments/oracle/map.py live/transcript.jsonl live/map.json live/ORACLE.md
          cd live && git add -A
          git -c user.name='oracle' -c user.email='oracle@users.noreply.github.com' commit -qm "THE ORACLE $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4; do git push -q origin HEAD:oracle-live && exit 0; sleep $((2**i)); git pull -q --rebase origin oracle-live; done; exit 1
          SH
          while :; do
            s=$(date -u +%s); [ "$s" -gt "$end" ] && break
            bash "$RUNNER_TEMP/cycle.sh" || echo "ORACLE_CYCLE_FAILED $(date -u +%FT%TZ)"
            [ $(( $(date -u +%s) - t0 )) -gt 20400 ] && break
            w=$(( 1800 - ($(date -u +%s) - s) )); [ "$w" -gt 0 ] && sleep "$w"
          done
          if [ "$(date -u +%s)" -lt "$end" ]; then gh workflow run oracle-live.yml --ref main -R "${{ github.repository }}" && echo ORACLE_SUCCESSOR_STARTED; fi
