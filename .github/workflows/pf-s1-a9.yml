# PF S1 amendment 9 (experiments/pf_storage/PF_S1_AMENDMENT_9.md): ONE RFC3161 token (once), then the audited reopening of
# a PF-1 halt whose only cause is a GitHub HTTP 5xx while uploading a state asset to the pf-live-state release, at exactly
# its durably committed prefix. First use: tick 24511.
name: PF S1 amendment 9 — seal, then reopen PF-1 after a release-upload 5xx halt
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pf-s1-a9.yml']
  workflow_dispatch:
    inputs:
      expect_tick:
        description: 'PF-1 halted tick the operator (or the halt watcher) expects to reopen'
        required: true
permissions:
  contents: read
concurrency:
  group: pf1-exclusive-live-continuous
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { path: orange, ref: main, fetch-depth: 1 }
      - uses: actions/checkout@v4
        with: { repository: adrianjohnsaker-wq/Amelia-0.4, ref: f1875b5eea5339eb1ac73e50b5df6b103d0cabe9, path: c1-pin, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: B1 amendment 9 bundle and ONE genuine RFC3161 token (only if not yet archived)
        id: seal
        working-directory: orange
        env: { PYTHONPATH: '${{ github.workspace }}/c1-pin', PYTHONDONTWRITEBYTECODE: '1', DRIFT_C1_ENABLE_LIVE: 'false' }
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r ../c1-pin/drift1a_c1/requirements.txt
          if [ -e experiments/pf_storage/seal_a9/receipt.json ]; then echo 'PF_S1_A9_SEAL_ALREADY_ARCHIVED'; echo 'archive=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          python - <<'PY'
          import hashlib,json,pathlib
          from drift1a_c1.beacon import Sealer
          p=pathlib.Path('/tmp/pfs1a9'); p.mkdir(parents=True,exist_ok=True)
          sha=lambda f:hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          files=['experiments/pf_storage/PF_S1_AMENDMENT_9.md','experiments/pf1/PF1_S1_RECOVER_A9.py','.github/workflows/pf-s1-a9.yml',
                 'experiments/pf_storage/PF_HALT_WATCH.py','.github/workflows/pf-halt-watch.yml']
          bundle={'schema':'PF_S1_A9_OPERATIONAL_SHA256_V1','amends':'experiments/pf_storage/seal/S1_SIGNED_BUNDLE.json',
            'firstUse':{'PF1':{'haltedTick':24511,'lastAdmittedRound':33735060,'head':'299d035d68eaf006f831dc6462c7e4cda391e490ddb5a808547479be8439dbaf',
                               'haltCommit':'543c0112','lease':'42313639382-1'}},
            'cause':'GitHub HTTP 5xx on gh release upload pf-live-state during an A1 batch (PF_STORE_GH_FAILED)','scienceChanged':False,'notificationsEnabled':False,
            'sourceSHA256':[{'path':f,'sha256':sha(f)} for f in files]}
          (p/'S1_A9_SIGNED_BUNDLE.json').write_text(json.dumps(bundle,sort_keys=True,indent=2)+'\n')
          imprint=sha(p/'S1_A9_SIGNED_BUNDLE.json')
          Sealer().seal(p/'seal',imprint)
          assert Sealer().verify(p/'seal',imprint)['status']=='PASS'
          print('PF_S1_A9_ONE_RFC3161_PASS',imprint)
          PY
          echo 'archive=true' >> "$GITHUB_OUTPUT"
      - name: B2 create-only archive of the amendment bundle, token and receipt
        if: steps.seal.outputs.archive == 'true'
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}' }
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib,subprocess
          p=pathlib.Path('/tmp/pfs1a9')
          files={'S1_A9_SIGNED_BUNDLE.json':p/'S1_A9_SIGNED_BUNDLE.json'}
          for n in sorted(x.name for x in (p/'seal').iterdir()):
            files[n]=p/'seal'/n
          assert 'receipt.json' in files,'MISSING receipt.json'
          for name in sorted(files,key=lambda k:k=='receipt.json'):
            dst='experiments/pf_storage/seal_a9/'+name
            payload={'message':'PF S1 amendment 9: ONE RFC3161 token, create-only '+name+'; zero admitted','branch':'main','content':base64.b64encode(files[name].read_bytes()).decode()}
            r=subprocess.run(['gh','api','-X','PUT','repos/'+os.environ['REPO']+'/contents/'+dst,'--input','-'],input=json.dumps(payload),capture_output=True,text=True)
            if r.returncode: raise RuntimeError('S1_A9_CREATE_ONLY_FAILED '+dst+' '+r.stderr[-800:])
            print('PF_S1_A9_ARCHIVED',dst)
          PY
  reopen:
    needs: seal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: { path: orange, ref: main, fetch-depth: 1 }
      - uses: actions/checkout@v4
        with: { repository: adrianjohnsaker-wq/Amelia-0.4, ref: f1875b5eea5339eb1ac73e50b5df6b103d0cabe9, path: c1-pin, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: R0 seals verified; no open lease; no live PF run; pinned PF-1 chain check on the halted state
        working-directory: orange
        env:
          GH_TOKEN: '${{ github.token }}'
          PYTHONPATH: '${{ github.workspace }}/c1-pin'
          DRIFT_C1_ENABLE_LIVE: 'false'
          # PF1_LIVE_CHECK.py refuses to run outside a lease. This job holds the exclusive PF concurrency group and has just
          # verified that no lease is open and no live run exists; it admits nothing. The flag only permits the read-only check.
          PF1_CHECK_UNDER_A9_AUDIT: 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ../c1-pin rev-parse HEAD)" = f1875b5eea5339eb1ac73e50b5df6b103d0cabe9
          python -m pip install -q -r ../c1-pin/drift1a_c1/requirements.txt
          for wf in pf1-live-observe-s1.yml pf2-live-observe-s1.yml; do
            for st in in_progress queued; do
              n=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf/runs?status=$st" --jq '.total_count')
              test "$n" = 0 || { echo "PF_S1_A9_LIVE_RUN_ACTIVE $wf $st $n"; exit 1; }
            done
          done
          python experiments/pf_storage/PF_STORE.py join experiments/pf1/live/STATE.json
          python experiments/pf_storage/PF_STORE.py join experiments/pf1/live/SILENT_LEDGER.json
          python experiments/pf_storage/PF_SEAL_CHECK.py experiments/pf_storage/seal experiments/pf_storage/seal_a8 experiments/pf_storage/seal_a9
          python - <<'PY'
          import pathlib
          root=pathlib.Path('drift1a_c1/runner_state')
          assert not [p.name for p in (root/'leases').glob('*.json') if not (root/'completions'/p.name).exists()],'OPEN_LEASE'
          print('PF_S1_A9_AUDIT_PASS')
          PY
          PF1_REMOTE_LEASE_ACKNOWLEDGED=true python experiments/pf1/PF1_LIVE_CHECK.py
      - name: R1 reopen PF-1 at its committed prefix; re-split; exact-byte join; commit receipt and state pointer only
        working-directory: orange
        env:
          PYTHONPATH: '${{ github.workspace }}/c1-pin'
          DRIFT_C1_ENABLE_LIVE: 'false'
          PF1_S1_A9_OPERATOR_CONTINUE: 'true'
          GH_TOKEN: '${{ github.token }}'
          PF1_S1_A9_SEAL_VERIFIED: 'true'
          PF1_S1_A9_EXPECT_TICK: "${{ github.event_name == 'workflow_dispatch' && inputs.expect_tick || '24511' }}"
        shell: bash
        run: |
          set -euo pipefail
          F=experiments/pf1/live/STATE.json
          python experiments/pf1/PF1_S1_RECOVER_A9.py | tee /tmp/a9.out
          RECEIPT=$(grep -o '"receipt": "[^"]*"' /tmp/a9.out | cut -d'"' -f4)
          test -f "$RECEIPT"
          PF1_REMOTE_LEASE_ACKNOWLEDGED=true python experiments/pf1/PF1_LIVE_CHECK.py
          WANT=$(sha256sum "$F" | cut -d' ' -f1)
          python experiments/pf_storage/PF_STORE.py split "$F"
          rm -f -- "$F"
          python experiments/pf_storage/PF_STORE.py join "$F"
          test "$(sha256sum "$F" | cut -d' ' -f1)" = "$WANT"
          git config user.name 'PF S1 authorised amendment 9 reopening'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$F.pointer.json" "$RECEIPT"
          git diff --cached --name-only | grep -v -e "^$F.pointer.json\$" -e "^$RECEIPT\$" && { echo 'PF_S1_A9_UNEXPECTED_PATH'; exit 1; } || true
          git diff --cached --quiet && { echo 'PF_S1_A9_NOTHING_STAGED'; exit 1; } || true
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          git commit -qm "PF S1 amendment 9: PF-1 reopened at its committed prefix (tick $(python -c "import json;print(json.load(open('$RECEIPT'))['newTicks'])")) after a release-upload 5xx halt; no scientific writes"
          git push -q origin HEAD:main
          git fetch -q origin main && test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          echo PF_S1_A9_REOPENED
