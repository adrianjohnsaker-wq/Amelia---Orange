name: STUDIO08 isolated input-pathway engineering preflight
on:
  push:
    branches:
      - studio08-closed-circuit-20261025
    paths:
      - 'experiments/studio08/**'
      - '.github/workflows/studio08-preflight.yml'
  pull_request:
    paths:
      - 'experiments/studio08/**'
      - '.github/workflows/studio08-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-qa-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned development dependencies (without lifecycle scripts)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: 'Non-hash smooth house cue: pure unit tests'
        run: node experiments/studio08/code/test_endogenous_cues.mjs
      - name: Exact source file and default-on patch custody
        run: node experiments/studio08/code/source_diff_gate.mjs
      - name: Runtime copy default fidelity and cue-off V/K/N isolation
        run: npx tsx experiments/studio08/code/input_pathway_audit.mjs
      - name: Negative control - archived input metadata must not be mistaken for endogenous cue
        run: npx tsx experiments/studio08/code/input_metadata_leakage_audit.mjs
      - name: Negative feedback control - source-bearing memory hash can turn choices
        run: npx tsx experiments/studio08/code/input_metadata_feedback_negative_control.mjs
      - name: Full-state forked constant-varying-absent input causal audit
        run: npx tsx experiments/studio08/code/fork_causality_audit.mjs
      - name: Archive hash and required-role gate adversarial tests
        run: python3 experiments/studio08/code/archive_gate.py --self-test
      - name: Exact-hash original Studio07 source scanner synthetic selftests
        run: node experiments/studio08/code/studio07_serializer_inventory.mjs --self-test
      - name: Strict eight-world original checkpoint import gate selftests
        run: python3 experiments/studio08/code/studio07_world_checkpoint_gate.py --self-test
      - name: Verify parent Studio runtime is unmodified by this PR
        run: git diff --exit-code -- experiments/studio/runtime_mirror
