name: WBD-1 adapter assay

on:
  push:
    branches:
      - wbd1-run-2026-10-27
    paths:
      - 'experiments/wbd1/**'
      - '.github/workflows/wbd1-run.yml'

permissions:
  contents: read

jobs:
  run-wbd1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run locked WBD-1 adapter assay
        run: npx tsx experiments/wbd1/run.ts
      - name: Upload immutable result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wbd1-adapter-results-${{ github.sha }}
          path: experiments/wbd1/results.json
          if-no-files-found: warn
          retention-days: 90
