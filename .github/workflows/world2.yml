# WORLD-2 (experiments/fep-inversion/world2/REGISTRATION.md). seal.trigger: RFC3161 over registration, harness, analysis,
# data preparation (with WE-1's encoder and edges) and the mirror. run.trigger: verify seal and sources, prepare the fresh
# world from world-live (stop, writing nothing, if not yet complete), mirror check, 180 runs, analysis. This branch only.
name: WORLD-2
on:
  push:
    branches: [fep-inversion-20261116]
    paths: ['experiments/fep-inversion/world2/seal.trigger', 'experiments/fep-inversion/world2/run.trigger']
permissions:
  contents: write
concurrency:
  group: world2
  cancel-in-progress: false
jobs:
  world2:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/checkout@v4
        with: { repository: adrianjohnsaker-wq/Amelia-0.4, ref: f1875b5eea5339eb1ac73e50b5df6b103d0cabe9, path: c1-pin, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: seal (once) or run
        shell: bash
        env: { PYTHONPATH: '${{ github.workspace }}/c1-pin', PYTHONDONTWRITEBYTECODE: '1', DRIFT_C1_ENABLE_LIVE: 'false' }
        run: |
          set -euo pipefail
          E=experiments/fep-inversion; P=$E/world2
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install -q -r c1-pin/drift1a_c1/requirements.txt
          export FILES="$P/REGISTRATION.md $P/prepare_world2.py $P/encode_we1.py $P/EDGES_we1.json $E/world2.mjs $E/fep.mjs $E/analyse_world2.mjs $E/run_world2.sh $E/eqcheck.mjs .github/workflows/world2.yml $(find $E/nd $E/nd0 -name '*.ts' | sort | tr '\n' ' ')"
          if git diff --name-only HEAD~1 HEAD | grep -qx "$P/seal.trigger" && [ ! -e $P/seal/receipt.json ]; then
            python - <<'PY'
          import datetime, hashlib, json, os, pathlib
          from drift1a_c1.beacon import Sealer
          P = pathlib.Path('experiments/fep-inversion/world2'); sha = lambda f: hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          b = {'schema': 'WORLD2_V1', 'sealedAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
               'seeds': [12001, 12030], 'regimes': ['B', 'D', 'DT', 'DT-s', 'TB', 'TB-s'], 'steps': 6000,
               'world': 'the 16,150 world-live data after WE-1 window (12,000 after 2026-11-13T17:56:41Z), R60',
               'sourceSHA256': [{'path': f, 'sha256': sha(f)} for f in os.environ['FILES'].split()]}
          (P / 'seal').mkdir(exist_ok=True); (P / 'seal/WORLD2_BUNDLE.json').write_text(json.dumps(b, sort_keys=True, indent=2) + '\n')
          imprint = sha(P / 'seal/WORLD2_BUNDLE.json'); Sealer().seal(P / 'seal', imprint)
          assert Sealer().verify(P / 'seal', imprint)['status'] == 'PASS'; print('WORLD2_SEALED', imprint)
          PY
            git add $P/seal; MSG='WORLD-2 registration sealed (RFC3161)'
          elif git diff --name-only HEAD~1 HEAD | grep -qx "$P/run.trigger" && [ -e $P/seal/receipt.json ] && [ ! -e $P/result/RESULT.json ]; then
            python - <<'PY'
          import hashlib, json, pathlib
          from drift1a_c1.beacon import Sealer
          P = pathlib.Path('experiments/fep-inversion/world2'); sha = lambda f: hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          b = json.loads((P / 'seal/WORLD2_BUNDLE.json').read_text())
          assert Sealer().verify(P / 'seal', sha(P / 'seal/WORLD2_BUNDLE.json'))['status'] == 'PASS'
          for x in b['sourceSHA256']: assert sha(x['path']) == x['sha256'], x['path']
          print('WORLD2_SEAL_AND_SOURCES_VERIFIED')
          PY
            git fetch -q --depth 1 origin world-live && git worktree add -q /tmp/live FETCH_HEAD
            set +e; python -I $P/prepare_world2.py /tmp/live 16150 $P/world_fresh.json $RUNNER_TEMP/prov.json; rc=$?; set -e
            if [ $rc -eq 3 ]; then echo 'WORLD-2: fresh world not yet complete; nothing written'; rm -f $P/world_fresh.json; exit 0; fi
            [ $rc -eq 0 ]
            mkdir -p $P/result; cp $RUNNER_TEMP/prov.json $P/result/WORLD_PROVENANCE.json
            (cd $E && node --experimental-strip-types --no-warnings eqcheck.mjs 3000 | tee world2/result/EQUIVALENCE.txt | tail -1 | grep -qx MIRROR_EQUIVALENT) && echo MIRROR_EQUIVALENT
            $E/run_world2.sh $P/result/runs 12001 12030 4
            (cd $E && node --experimental-strip-types --no-warnings analyse_world2.mjs world2/result/runs world2/result/RESULT.json | tee world2/result/RESULT.txt)
            git add $P/result $P/world_fresh.json; MSG='WORLD-2 result'
          else echo 'nothing to do'; exit 0; fi
          git commit -qm "$MSG"
          for i in 1 2 3 4; do git pull -q --rebase origin fep-inversion-20261116 && git push -q origin HEAD:fep-inversion-20261116 && break; sleep $((2**i)); done
