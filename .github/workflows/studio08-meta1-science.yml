name: Studio08 META1 stage 4 presealed complete science
on:
  push:
    branches:
      - studio08-meta1-20261025
    paths:
      - 'experiments/studio08/meta1/META1_LAUNCH_SEAL.json'

permissions:
  contents: read

jobs:
  science-worlds:
    name: Full scientific worlds shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact seal identity and preregistration before any experimental step
        run: |
          python3 - <<'PY'
          import sys,json
          sys.path.insert(0,'experiments/studio08/meta1')
          from meta1_batch import validate_seal
          x=validate_seal()
          print('META1_PRESEAL_VALID_FOR_SCIENCE:',json.dumps(x,sort_keys=True))
          PY
      - name: Execute and audit all six runs for eight previously unseen worlds
        run: python3 experiments/studio08/meta1/meta1_batch.py --mode science --shard ${{ matrix.shard }} --output "meta1-science-shard-${{ matrix.shard }}"
      - name: Upload all 48 complete raw transition files, summaries and checkpoint proofs
        uses: actions/upload-artifact@v4
        with:
          name: meta1-science-shard-${{ matrix.shard }}
          path: meta1-science-shard-${{ matrix.shard }}/
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

  preregistered-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: science-worlds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: meta1-science-shard-*
          path: _meta1_science
          merge-multiple: false
      - name: Verify all 192 full traces and apply the single registered exact sign test
        run: |
          python3 experiments/studio08/meta1/meta1_analysis.py \
            --root _meta1_science \
            --seal experiments/studio08/meta1/META1_LAUNCH_SEAL.json \
            --output META1_ANALYSIS_RESULT.json
          sha256sum META1_ANALYSIS_RESULT.json
      - name: Retain full world-level result and analysis receipt
        uses: actions/upload-artifact@v4
        with:
          name: meta1-scientific-analysis
          path: META1_ANALYSIS_RESULT.json
          if-no-files-found: error
          retention-days: 90
