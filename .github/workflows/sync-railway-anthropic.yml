name: Deploy Amelia Anthropic relay to Railway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/anthropic-language-relay.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'railway.json'

permissions:
  contents: read

jobs:
  deploy-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Store Anthropic key in Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "Add the project-scoped RAILWAY_TOKEN repository secret before running this workflow."
            exit 1
          fi
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "The ANTHROPIC_API_KEY repository secret is missing or empty."
            exit 1
          fi
          railway variable set "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" \
            --project 29d0c07c-fd91-4c25-ae78-63f9af2dcd8f \
            --environment production \
            --service 49310c8b-f917-491b-b4f3-8a42ae032bb3 \
            --skip-deploys

      - name: Deploy relay
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --project 29d0c07c-fd91-4c25-ae78-63f9af2dcd8f --environment production --service 49310c8b-f917-491b-b4f3-8a42ae032bb3 --ci -m "Deploy Amelia Anthropic relay"
