name: Build Amelia Orange Tablet APK

on:
  push:
    branches: [main, fix/amelia-live-persistent-loop-20261105, research/live-pointer-baseline-20261105, research/live-run-history-20261109]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'railway.json'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tablet-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Test live synthetic source and continuity
        if: github.ref_name == 'research/live-pointer-baseline-20261105' || github.ref_name == 'research/live-run-history-20261109'
        run: node --import tsx --test experiments/live-pointer-baseline/*.test.ts experiments/live-amelia/*.test.ts

      - name: Build Amelia UI, substrate, and type checks for the tablet
        env:
          VITE_AMELIA_LOCAL_ONLY: '1'
        run: |
          if [[ "$GITHUB_REF_NAME" == 'research/live-pointer-baseline-20261105' || "$GITHUB_REF_NAME" == 'research/live-run-history-20261109' ]]; then
            export VITE_AMELIA_RESEARCH_NAMESPACE='1'
          fi
          npm run build

      - name: Construct Android wrapper and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/org/amelia/orange android/app/src/main/assets
          cp -R dist/. android/app/src/main/assets/
          echo "$GITHUB_SHA" > BUILD_COMMIT.txt
          echo "LOCAL_ONLY=1 - no Firebase/Firestore; authenticated Supabase memory available" > BUILD_MODE.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > WEB_ASSET_SHA256.txt
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'AmeliaOrangeTablet'
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' > android/gradle.properties
          echo 'android.useAndroidX=true' >> android/gradle.properties
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'org.amelia.orange'
              compileSdk 35
              defaultConfig {
                  applicationId 'org.amelia.orange'
                  minSdk 24
                  targetSdk 35
                  versionCode 8
                  versionName '0.1.7'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="Amelia Orange"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity"
                      android:windowSoftInputMode="adjustResize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          if [[ "$GITHUB_REF_NAME" == 'research/live-pointer-baseline-20261105' ]]; then
            sed -i "s/applicationId 'org.amelia.orange'/applicationId 'org.amelia.orange.research'/" android/app/build.gradle
            sed -i 's/android:label="Amelia Orange"/android:label="Amelia Orange Research"/' android/app/src/main/AndroidManifest.xml
          fi
          # The installed research app cannot be updated in place (each runner signs with a new debug key),
          # so this build installs beside it under its own ID and takes over the same research table.
          if [[ "$GITHUB_REF_NAME" == 'research/live-run-history-20261109' ]]; then
            sed -i "s/applicationId 'org.amelia.orange'/applicationId 'org.amelia.orange.research.runs'/" android/app/build.gradle
            sed -i "s/versionName '0.1.7'/versionName '0.1.8-runs'/" android/app/build.gradle
            sed -i 's/android:label="Amelia Orange"/android:label="Amelia Research Runs"/' android/app/src/main/AndroidManifest.xml
          fi
          cat > android/app/src/main/java/org/amelia/orange/MainActivity.java <<'EOF'
          package org.amelia.orange;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public final class MainActivity extends Activity {
              private WebView webView;
              private static final String HOME = "https://appassets.androidplatform.net/assets/index.html";

              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setSoftInputMode(android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(-1, -1));
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setAllowFileAccessFromFileURLs(false);
                  s.setAllowUniversalAccessFromFileURLs(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();
                  webView.setWebViewClient(new WebViewClientCompat() {
                      @Override public WebResourceResponse shouldInterceptRequest(
                          WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }
                      @Override public boolean shouldOverrideUrlLoading(
                          WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if ("appassets.androidplatform.net".equals(uri.getHost())) return false;
                          if (!"https".equals(uri.getScheme())) return true;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); }
                          catch (ActivityNotFoundException ignored) {}
                          return true;
                      }
                  });
                  if (savedInstanceState == null) webView.loadUrl(HOME);
                  else webView.restoreState(savedInstanceState);
              }

              @Override protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }
              @Override public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
              @Override protected void onDestroy() {
                  if (webView != null) { webView.destroy(); webView = null; }
                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile installable APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Sign with the stable Amelia key, if configured
        # With the repository secrets AMELIA_KEYSTORE_B64, AMELIA_KEYSTORE_PASSWORD and AMELIA_KEY_ALIAS set,
        # every build carries the same certificate, so later builds update the installed app in place.
        env:
          KS_B64: ${{ secrets.AMELIA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.AMELIA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.AMELIA_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KS_B64:-}" ]]; then echo 'No stable key configured; keeping the debug signature.'; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/amelia.jks"
          apksigner="$(find "${ANDROID_HOME:?}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" sign --ks "$RUNNER_TEMP/amelia.jks" --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" \
            android/app/build/outputs/apk/debug/app-debug.apk
          rm -f "$RUNNER_TEMP/amelia.jks"

      - name: Hash APK
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > APK_SHA256.txt

      - name: Record APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_HOME:?}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          aapt="$(find "${ANDROID_HOME:?}/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          test -n "$aapt"
          "$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > APK_SIGNING_CERTIFICATE.txt
          "$aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > APK_BADGING.txt
          if [[ "$GITHUB_REF_NAME" == 'research/live-run-history-20261109' ]]; then
            echo 'Amelia Research Runs installs beside the existing apps under its own application ID. On sign-in it reads her existing research copy (it does not bootstrap from main) and adds the Research Runs history. Keep the existing apps and their data; do not uninstall them. Do not open the older research app on the same account while this one is in use, so only one installation writes her research copy.' > INSTALLATION_NOTE.txt
          elif [[ "$GITHUB_REF_NAME" == 'research/live-pointer-baseline-20261105' ]]; then
            echo 'This research APK uses a separate application ID and a separate cloud memory table. It can be installed alongside the existing app. On first sign-in it copies the main checkpoint, then saves an independent research history. Preserve the existing app and its data. Avoid running two research installations on the same account simultaneously; future APK updates also need a compatible signing certificate.' > INSTALLATION_NOTE.txt
          else
            echo 'Preserve the existing tablet data. Do not uninstall the installed app to install this build. An update requires the same Android signing certificate.' > INSTALLATION_NOTE.txt
          fi

      - name: Upload tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Orange-Tablet-APK-v0.1.7
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            APK_SHA256.txt
            APK_SIGNING_CERTIFICATE.txt
            APK_BADGING.txt
            INSTALLATION_NOTE.txt
            BUILD_COMMIT.txt
            BUILD_MODE.txt
            WEB_ASSET_SHA256.txt

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Orange-Browser-Build
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/
            package.json
