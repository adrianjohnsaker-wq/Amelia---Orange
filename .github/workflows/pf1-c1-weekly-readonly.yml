name: PF1 Weekly C1 Continuity — READ ONLY, NO DISPATCH
on:
  schedule:
    - cron: '17 08 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pf1-c1-weekly-readonly.yml'
      - 'experiments/pf1/PF1_C1_WEEKLY_READONLY.py'
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: orange
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: adrianjohnsaker-wq/Amelia-0.4
          ref: amelia-1.0
          path: c1-readonly
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned C1 dependency specification; no C1 operation
        working-directory: c1-readonly
        run: python -m pip install -r drift1a_c1/requirements.txt
      - name: Verify current C1 genesis, chain/ticks and head digest; absolutely no dispatch
        working-directory: c1-readonly
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ${{ github.workspace }}/c1-readonly
          DRIFT_C1_ENABLE_LIVE: 'false'
          PF1_C1_WEEKLY_RESULT: ${{ github.workspace }}/orange/experiments/pf1/weekly-audit/C1_READONLY_CURRENT_HEAD.json
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python ../orange/experiments/pf1/PF1_C1_WEEKLY_READONLY.py
          test -z "$(git status --porcelain)"
          echo PF1_C1_WEEKLY_AUDIT_READONLY_COMPLETE
      - name: Archive weekly current head and continuity; no writes or notifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PF1-C1-WEEKLY-READONLY-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: orange/experiments/pf1/weekly-audit/C1_READONLY_CURRENT_HEAD.json
