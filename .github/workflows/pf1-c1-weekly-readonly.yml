name: PF1 Weekly C1 and PF1 Status — READ ONLY INPUTS, DATED COMMIT
on:
  schedule:
    - cron: '17 08 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pf1-c1-weekly-readonly.yml'
      - 'experiments/pf1/PF1_C1_WEEKLY_READONLY.py'
      - 'experiments/pf1/PF1_WEEKLY_AUDIT_TEST.py'
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: orange
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: adrianjohnsaker-wq/Amelia-0.4
          ref: amelia-1.0
          path: c1-readonly
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original C1 verifier dependencies, no C1 invocation or dispatch
        working-directory: c1-readonly
        run: python -m pip install -r drift1a_c1/requirements.txt
      - name: Exercise PF1 read-only status contract with temporary synthetic fixtures
        working-directory: c1-readonly
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ${{ github.workspace }}/c1-readonly
          DRIFT_C1_ENABLE_LIVE: 'false'
        run: |
          set -euo pipefail
          python ../orange/experiments/pf1/PF1_WEEKLY_AUDIT_TEST.py
      - name: Read CURRENT C1 chain head and Orange PF1 live-only ledger/status (NO DISPATCH)
        id: audit
        working-directory: c1-readonly
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ${{ github.workspace }}/c1-readonly
          PF1_ORANGE_REPOSITORY: ${{ github.workspace }}/orange
          DRIFT_C1_ENABLE_LIVE: 'false'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python ../orange/experiments/pf1/PF1_C1_WEEKLY_READONLY.py
          test -z "$(git status --porcelain)"
          echo PF1_WEEKLY_CURRENT_C1_READONLY_PASS
      - name: Archive dated result as secondary copy for audit (no notifications)
        uses: actions/upload-artifact@v4
        with:
          name: PF1-C1-COMBINED-WEEKLY-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: orange/experiments/pf1/weekly-audit/PF1_C1_WEEKLY_*.json
  commit-report:
    needs: continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PF1-C1-COMBINED-WEEKLY-${{ github.run_id }}
          path: report-only
      - name: Validate exactly one dated PF1 audit and commit using one allowlisted Contents API path
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python - <<'PY'
          import glob,json,os,pathlib,re
          names=glob.glob('report-only/PF1_C1_WEEKLY_*.json')
          assert len(names)==1, 'EXPECTED_ONE_DATED_AUDIT_REPORT'
          p=pathlib.Path(names[0])
          assert re.fullmatch(r'PF1_C1_WEEKLY_\d{4}-\d{2}-\d{2}T\d{6}Z_run'+re.escape(os.environ['GITHUB_RUN_ID'])+r'\.json',p.name)
          doc=json.loads(p.read_text('utf-8'))
          expected='experiments/pf1/weekly-audit/'+p.name
          assert doc['reportPath']==expected
          assert doc['schema']=='PF1_C1_COMBINED_WEEKLY_READONLY_V2'
          assert doc['auditStatus']=='PASS'
          assert doc['actions']['C1DispatchPerformed'] is False
          assert doc['actions']['C1FilesModified'] is False
          assert doc['actions']['liveRoundsAdmitted']==0
          assert doc['actions']['outboundNotificationsSent']==0
          assert not pathlib.Path('.git').exists(), 'COMMIT_JOB_MUST_NOT_CHECKOUT_WRITEABLE_REPO'
          pathlib.Path('report-path.txt').write_text(expected,encoding='utf-8')
          print('PATH_ALLOWLISTED_FOR_SINGLE_GITHUB_CONTENTS_API_WRITE',expected)
          PY
          target="$(cat report-path.txt)"
          case "$target" in
            experiments/pf1/weekly-audit/PF1_C1_WEEKLY_*_run"$GITHUB_RUN_ID".json) ;;
            *) echo PF1_WRITE_PATH_FORBIDDEN >&2; exit 7 ;;
          esac
          filename="${target##*/}"
          content="$(base64 -w0 "report-only/$filename")"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$target" \
            -f message="PF1 weekly READ ONLY C1 continuity and PF1 status report $filename" \
            -f branch="main" \
            -f content="$content" \
            --jq '.content.path' | grep -Fx -- "$target"
          echo "PF1_DATED_AUDIT_COMMITTED_ONLY_UNDER_WEEKLY_AUDIT_PATH=$target"
          echo "No encounter notification or C1 dispatch was performed." >> "$GITHUB_STEP_SUMMARY"
