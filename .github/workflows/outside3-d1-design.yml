name: OUTSIDE-3 D1 Paired Synthetic Design (NO CALIBRATION)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/outside3-d1-design.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npx tsx experiments/outside3/v2/d1ReadoutDiagnostic.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OUTSIDE3-D1-READOUT-DIAGNOSTIC
          path: experiments/outside3/v2/d1-output/D1_READOUT_DIAGNOSTIC*
          retention-days: 90
  series:
    needs: diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        window: [0, 1, 3, 10, 30]
        start: [0, 50, 100, 150]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Exact-integer design P1, C/M/Raw paired rankings
        shell: bash
        run: |
          set -euo pipefail
          npx tsx experiments/outside3/v2/d1Sensitivity.ts "${{ matrix.window }}" "${{ matrix.start }}" 50
          cd experiments/outside3/v2/d1-output
          sha256sum -c "D1_W${{ matrix.window }}_S${{ matrix.start }}.json.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OUTSIDE3-D1-W${{ matrix.window }}-S${{ matrix.start }}
          path: experiments/outside3/v2/d1-output/D1_W*
          retention-days: 90
          if-no-files-found: warn

  aggregate-and-g:
    needs: [diagnostic, series]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Require full synthetic 200-series completion
        shell: bash
        run: |
          test "${{ needs.diagnostic.result }}" = success
          test "${{ needs.series.result }}" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: OUTSIDE3-D1-W*
          path: experiments/outside3/v2/d1-output
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: OUTSIDE3-D1-READOUT-DIAGNOSTIC
          path: experiments/outside3/v2/d1-output
      - name: Apply precommitted sensitivity objective and C-M/C-Raw floor
        run: npx tsx experiments/outside3/v2/d1Aggregate.ts
      - name: Test eligible nominee with pinned G rewiring and deterministic replay
        run: npx tsx experiments/outside3/v2/d1GReplay.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OUTSIDE3-D1-SYNTHETIC-DESIGN-COMPLETE
          path: experiments/outside3/v2/d1-output/
          retention-days: 90
          if-no-files-found: warn
      - name: Archive concise synthetic design result (no freeze)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/outside3/v2/d1-output/D1_DESIGN_RESULT.json experiments/outside3/v2/d1-output/D1_DESIGN_RESULT.md
          git add experiments/outside3/v2/d1-output/D1_G_ENGINEERING.json experiments/outside3/v2/d1-output/D1_G_ENGINEERING.md
          git add experiments/outside3/v2/d1-output/D1_READOUT_DIAGNOSTIC.json experiments/outside3/v2/d1-output/D1_READOUT_DIAGNOSTIC.md
          git diff --cached --check
          git commit -m "Archive D1 synthetic design and pinned G engineering without registration or calibration"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
